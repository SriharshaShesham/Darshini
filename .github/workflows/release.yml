name: Build & Release Signed APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > darshini-release.jks

      - name: Create keystore.properties
        run: |
          echo "storeFile=darshini-release.jks" > keystore.properties
          echo "storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> keystore.properties

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease
          # Name the asset after the tag. Was hardcoded to v1.0.0, so every release
          # published an APK claiming to be 1.0.0 regardless of what was built.
          VERSION="${GITHUB_REF_NAME:-dev}"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/darshini.${VERSION}.apk"
          # Stable filename so /releases/latest/download/darshini.apk is a permanent
          # URL. darshini.sheshams.in redirects there — do not rename this asset.
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/darshini.apk

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          # A tag with a suffix (v1.4-beta) publishes as a pre-release, which keeps it out of
          # /releases/latest — so darshini.sheshams.in keeps serving the last stable build.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            app/build/outputs/apk/release/darshini.${{ github.ref_name }}.apk
            app/build/outputs/apk/release/darshini.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
